[build-system]
requires = [
    "scikit-build-core>=0.5",
    "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "zagar"
version = "0.2.0"
description = "Efficient algorithms for exact and approximate enumeration of admixed arrays"
readme = "README_PyPI.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Alan J. Aw", email = "nalawanij@gmail.com"},
]
maintainers = [
    {name = "Alan J. Aw", email = "nalawanij@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["combinatorics", "binary matrices", "counting"]
# numpy is imported at module scope in __init__.py (get_constraints takes and
# returns arrays), so without this `import zagar` fails outright on a clean
# install.  0.1.0 declared no runtime dependencies at all.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "build", "twine"]

[tool.scikit-build]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/zagar"]
wheel.exclude = ["*.cpp", "*.hpp"]
sdist.include = ["pyproject.toml", "CMakeLists.txt", "README_PyPI.md", "src/zagar/*.cpp", "src/zagar/*.hpp", "src/zagar/*.py", "LICENSE"]
sdist.exclude = ["docs", "build",".git", "README.md", "GitHub_images", ".gitattributes", ".gitignore", ".pytest_cache", "*.egg-info", "__pycache__", ".DS_Store", ".claude", "count_binary.cpp", "tests/__pycache__"]

[tool.pytest.ini_options]
# Doctests are part of the suite.  Three examples in __init__.py had been
# failing since before 0.2.0 -- one expecting a rounded float where repr gives
# full precision, two with no expected output recorded at all -- purely because
# nothing ever ran them.  Collecting them here is what stops that recurring.
# Only .py files are collected, so the docstrings compiled into _core are not
# executed; those examples are checked by hand.
addopts = "--doctest-modules"
testpaths = ["tests", "src/zagar"]
