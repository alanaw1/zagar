name: Build and Publish Wheels

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0
  workflow_dispatch:  # Allow manual triggering

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        # macos-13 is Intel, macos-14 is Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - name: Install Boost (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install boost-msvc-14.3 -y
          echo "Boost_INCLUDE_DIRS=C:\local\boost_1_82_0" >> $env:GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # Build for Python 3.9-3.12
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-*
          # Skip 32-bit builds and musl Linux
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          # Install Boost in manylinux containers
          CIBW_BEFORE_ALL_LINUX: yum install -y boost-devel || apt-get update && apt-get install -y libboost-dev
          # macOS: ensure Boost is found
          CIBW_ENVIRONMENT_MACOS: Boost_INCLUDE_DIRS=/opt/homebrew/include:/usr/local/include
          # Windows: set Boost path
          CIBW_ENVIRONMENT_WINDOWS: Boost_INCLUDE_DIRS=C:\\local\\boost_1_82_0
          # Test the built wheel
          CIBW_TEST_COMMAND: python -c "import zagar; print(zagar.__version__); print(zagar.getA1(N=3, P=2, a_vec=[2,2,2]))"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - configure at pypi.org/manage/project/zagar/settings/publishing/
